name: Weekly recovery model retraining

on:
  schedule:
    - cron: "0 2 * * 0"
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install --no-cache-dir -r requirements.txt
      - name: Retrain and stage model
        env:
          DATABASE_URL: ${{ secrets.RETRAIN_DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          MODEL_DIR: models
        run: |
          if [ "${{ github.event.schedule }}" = "0 2 * * 1" ]; then
            python scripts/retrain_automl.py --baseline data/recovery_training.csv --promote-only
          else
            python scripts/retrain_automl.py --baseline data/recovery_training.csv
          fi
      - name: Upload registry events
        uses: actions/upload-artifact@v4
        with:
          name: retraining-registry
          path: backend/models/registry/
